      opacity: 0.95;

<body>
  <div class="launcher-card" id="launcherCard">
    <div class="badge">بيئة التشغيل / Environment Notice</div>
    <h1>Health Vibe AI</h1>
    <p>
      تم فتح الصفحة كملف محلي (<code>file://</code>). يتطلب تسجيل الدخول عبر Firebase تشغيل التطبيق من خلال السيرفر المحلي.
    </p>
    <a href="http://localhost:3000" class="btn-primary" id="launchBtn">
      الدخول عبر السيرفر المحلي (http://localhost:3000)
    </a>
    <div class="note">
      إذا لم يفتح الرابط، تأكد من تشغيل <code>start-server.bat</code> أو <code>serve.ps1</code> في مجلد المشروع.
    </div>
  </div>

  <script>
    if (window.location.protocol !== "file:") {
      // Running under HTTP server (e.g. localhost)
      window.location.replace("./app/index.html");
    } else {
      // Under file://, check if localhost:3000 is active and auto-redirect
      fetch("http://localhost:3000/index.html", { method: "HEAD", mode: "no-cors" })
        .then(function() {
          window.location.href = "http://localhost:3000";
        })
        .catch(function() {
          // Keep the guide visible
        });
    }
  </script>
</body>
