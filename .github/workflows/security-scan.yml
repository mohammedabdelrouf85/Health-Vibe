name: Security - Dependency Audit & Secret Scan

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC

jobs:
  security-audit:
    name: Dependency Vulnerability & Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci && cd ..

      - name: Run Root Dependency Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Run Backend Dependency Audit
        run: |
          cd backend
          npm audit --audit-level=high --omit=dev
          cd ..

      - name: Execute Security & Secrets Test Suite
        run: npm run test:security

      - name: Verify CSP Security Headers & Storage Rules Hardening
        run: |
          node tests/csp_security_headers.test.js
          node tests/validation_hardening.test.js
